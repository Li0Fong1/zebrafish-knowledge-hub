<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900"
     preserveAspectRatio="xMidYMax slice" role="img" aria-label="underwater scene">
  <title>Zebrafish Agent · underwater scene</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0"/>
      <stop offset=".55" stop-color="#c7ddfb" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a9cdf7" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="fishA" x1="0" y1="0" x2="1" y2=".35">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".62"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="fishB" x1="0" y1="0" x2="1" y2=".35">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="kelp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#15803d" stop-opacity=".50"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="helix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".48"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity=".22"/>
    </linearGradient>
    <clipPath id="bodyClip"><ellipse cx="0" cy="0" rx="46" ry="18"/></clipPath>

    <g id="fish">
      <ellipse cx="0" cy="0" rx="46" ry="18" fill="url(#fishA)"/>
      <g clip-path="url(#bodyClip)" opacity=".5">
        <rect x="-26" y="-20" width="5" height="40" fill="#ffffff"/>
        <rect x="-12" y="-20" width="5" height="40" fill="#ffffff"/>
        <rect x="2" y="-20" width="5" height="40" fill="#ffffff"/>
        <rect x="16" y="-20" width="5" height="40" fill="#ffffff"/>
        <rect x="30" y="-20" width="5" height="40" fill="#ffffff"/>
      </g>
      <path d="M-46,0 l-30,-16 v32 z" fill="url(#fishA)"/>
      <path d="M-8,-18 l12,-15 l13,11 z" fill="url(#fishA)" opacity=".85"/>
      <path d="M6,16 l9,13 l13,-9 z" fill="url(#fishA)" opacity=".7"/>
      <circle cx="32" cy="-4" r="2.6" fill="#0b2b52" opacity=".65"/>
    </g>
  </defs>

  <!-- 水体渐变 -->
  <rect y="300" width="1440" height="600" fill="url(#water)"/>

  <!-- 气泡 -->
  <g fill="#ffffff" opacity=".62" stroke="#8ec5f5" stroke-width="1.5">
    <circle cx="210" cy="700" r="7"/><circle cx="248" cy="646" r="4"/>
    <circle cx="300" cy="742" r="10"/><circle cx="352" cy="688" r="5"/>
    <circle cx="1180" cy="726" r="8"/><circle cx="1228" cy="664" r="5"/>
    <circle cx="1272" cy="756" r="11"/><circle cx="1330" cy="700" r="4"/>
    <circle cx="880" cy="792" r="6"/><circle cx="930" cy="740" r="3.5"/>
  </g>

  <!-- 海草丛（左右各一丛） -->
  <g fill="none" stroke="url(#kelp)" stroke-linecap="round" stroke-width="9">
    <path d="M120,900 C104,760 150,700 132,600 C118,528 152,486 140,430"/>
    <path d="M170,900 C158,790 196,736 182,650 C170,578 202,540 194,486"/>
    <path d="M222,900 C214,806 246,762 236,690 C228,630 254,596 248,548"/>
    <path d="M1310,900 C1296,772 1338,712 1322,620 C1310,552 1342,512 1332,458"/>
    <path d="M1360,900 C1350,800 1386,748 1374,666 C1364,598 1394,562 1386,512"/>
  </g>

  <!-- 右侧 DNA 双螺旋 -->
  <g opacity=".8" stroke-linecap="round">
    <path d="M1010,900 C1090,830 930,760 1010,690 C1090,620 930,550 1010,480 C1090,410 930,340 1010,270"
          fill="none" stroke="url(#helix)" stroke-width="7"/>
    <path d="M1120,900 C1040,830 1200,760 1120,690 C1040,620 1200,550 1120,480 C1040,410 1200,340 1120,270"
          fill="none" stroke="url(#helix)" stroke-width="7"/>
    <g stroke="#60a5fa" stroke-width="4" opacity=".55">
      <path d="M1020,860 h90"/><path d="M996,820 h118"/><path d="M1000,780 h110"/>
      <path d="M1030,740 h50"/><path d="M1030,700 h50"/><path d="M1000,660 h110"/>
      <path d="M996,620 h118"/><path d="M1020,580 h90"/><path d="M1000,500 h110"/>
      <path d="M1030,460 h50"/><path d="M996,420 h118"/><path d="M1020,380 h90"/>
      <path d="M1000,340 h110"/><path d="M1030,300 h50"/>
    </g>
  </g>

  <!-- 斑马鱼（3 条，远近不同） -->
  <g opacity=".95">
    <use href="#fish" transform="translate(430,640) scale(1.25)"/>
    <use href="#fish" transform="translate(700,742) scale(.85) rotate(-4)"/>
    <use href="#fish" transform="translate(300,520) scale(.66) rotate(-8)"/>
    <use href="#fish" transform="translate(1010,560) scale(.7) rotate(6)"/>
  </g>
</svg>
