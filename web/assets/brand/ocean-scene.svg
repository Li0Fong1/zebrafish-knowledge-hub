<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="underwater scene">
  <title>Zebrafish Agent · underwater scene</title>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0"/>
      <stop offset=".45" stop-color="#c3daf9" stop-opacity=".50"/>
      <stop offset="1" stop-color="#9dc6f4" stop-opacity=".80"/>
    </linearGradient>
    <linearGradient id="fishA" x1="0" y1="0" x2="1" y2=".35">
      <stop offset="0" stop-color="#0284c7" stop-opacity=".72"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="kelp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#15803d" stop-opacity=".62"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="helix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".60"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity=".30"/>
    </linearGradient>
    <clipPath id="bodyClip"><ellipse cx="0" cy="0" rx="46" ry="18"/></clipPath>

    <g id="fish">
      <ellipse cx="0" cy="0" rx="46" ry="18" fill="url(#fishA)"/>
      <g clip-path="url(#bodyClip)" opacity=".55">
        <rect x="-26" y="-20" width="5" height="40" fill="#ffffff"/>
        <rect x="-12" y="-20" width="5" height="40" fill="#ffffff"/>
        <rect x="2" y="-20" width="5" height="40" fill="#ffffff"/>
        <rect x="16" y="-20" width="5" height="40" fill="#ffffff"/>
        <rect x="30" y="-20" width="5" height="40" fill="#ffffff"/>
      </g>
      <path d="M-46,0 l-30,-16 v32 z" fill="url(#fishA)"/>
      <path d="M-8,-18 l12,-15 l13,11 z" fill="url(#fishA)" opacity=".85"/>
      <path d="M6,16 l9,13 l13,-9 z" fill="url(#fishA)" opacity=".7"/>
      <circle cx="32" cy="-4" r="2.6" fill="#0b2b52" opacity=".6"/>
    </g>

    <g id="kelpStrand" fill="none" stroke="url(#kelp)" stroke-linecap="round" stroke-width="10">
      <path d="M0,900 C-16,760 30,700 12,600 C-2,528 32,486 20,430"/>
    </g>
  </defs>

  <rect width="1440" height="900" fill="url(#water)"/>

  <g fill="#ffffff" opacity=".7" stroke="#9ecbf3" stroke-width="1.4">
    <circle cx="120" cy="250" r="9"/><circle cx="160" cy="196" r="5"/>
    <circle cx="205" cy="288" r="12"/><circle cx="255" cy="232" r="6"/>
    <circle cx="1240" cy="236" r="8"/><circle cx="1284" cy="182" r="5"/>
    <circle cx="1330" cy="272" r="11"/><circle cx="1268" cy="330" r="4"/>
    <circle cx="700" cy="150" r="6"/><circle cx="745" cy="112" r="4"/>
    <circle cx="300" cy="806" r="7"/><circle cx="360" cy="838" r="4.5"/>
    <circle cx="1080" cy="812" r="8"/><circle cx="1130" cy="842" r="5"/>
  </g>

  <g>
    <use href="#kelpStrand" transform="translate(96,0)"/>
    <use href="#kelpStrand" transform="translate(150,0) scale(1.06)"/>
    <use href="#kelpStrand" transform="translate(206,0) scale(.92)"/>
  </g>
  <g>
    <use href="#kelpStrand" transform="translate(1296,0) scale(1.02)"/>
    <use href="#kelpStrand" transform="translate(1352,0) scale(.94)"/>
  </g>

  <g opacity=".85" stroke-linecap="round">
    <path d="M1075,460 C1155,390 995,320 1075,250 C1155,180 995,110 1075,40"
          fill="none" stroke="url(#helix)" stroke-width="7"/>
    <path d="M1185,460 C1105,390 1265,320 1185,250 C1105,180 1265,110 1185,40"
          fill="none" stroke="url(#helix)" stroke-width="7"/>
    <g stroke="#7cb8f0" stroke-width="3.6" opacity=".7">
      <path d="M1086,420 h88"/><path d="M1062,384 h116"/><path d="M1066,348 h108"/>
      <path d="M1096,312 h48"/><path d="M1096,276 h48"/><path d="M1066,240 h108"/>
      <path d="M1062,204 h116"/><path d="M1086,168 h88"/><path d="M1096,132 h48"/>
      <path d="M1066,96 h116"/><path d="M1086,60 h88"/>
    </g>
  </g>

  <g opacity=".95">
    <use href="#fish" transform="translate(690,150) scale(.92) rotate(-6)"/>
    <use href="#fish" transform="translate(360,232) scale(.66) rotate(-10)"/>
    <use href="#fish" transform="translate(1180,600) scale(.78) rotate(8)"/>
    <use href="#fish" transform="translate(240,700) scale(1.15)"/>
  </g>
</svg>
